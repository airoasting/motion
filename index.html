<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>motion · AI ROASTING</title>
<meta name="description" content="AI ROASTING 모션 그래픽 모음">
<style>
@font-face{font-family:"Pretendard";src:url("october-tear/assets/fonts/Pretendard-subset.woff2") format("woff2");font-weight:100 900;}
:root{--bg:#111111;--ink:#F0ECE5;--mute:#888880;--acc:#E85D26;--line:#282826}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Pretendard",system-ui,-apple-system,sans-serif;word-break:keep-all}
main{max-width:1120px;margin:0 auto;padding:48px 16px 80px}
.kicker{font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;letter-spacing:.14em;text-transform:uppercase;color:var(--mute);margin:0 0 12px}
h1{font-size:clamp(36px,7vw,72px);font-weight:900;letter-spacing:-.04em;line-height:.95;margin:0 0 16px}
h1 span{color:var(--acc)}
.lead{color:var(--mute);line-height:1.7;margin:0 0 32px;max-width:640px}
video{display:block;width:100%;aspect-ratio:16/9;background:#000;border:1px solid var(--line)}
.meta{display:flex;flex-wrap:wrap;gap:8px 24px;margin:16px 0 0;font-family:"IBM Plex Mono",ui-monospace,monospace;font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--mute)}
a{color:var(--ink)}
footer{margin-top:48px;padding-top:16px;border-top:1px solid var(--line);color:var(--mute);font-size:14px;line-height:1.7}
</style>
</head>
<body>
<main>
  <p class="kicker">motion · 01</p>
  <h1>10월 아침,<br>고요를 <span>찢다</span></h1>
  <p class="lead">10월의 아침은 조용히 오지 않는다. 단어 "고요"가 첫 킥에 자모로 갈라지고, 흩어진 자모가 박마다 새 단어로 다시 조립되는 30초 키네틱 타이포그래피.</p>
  <video src="october-tear/renders/october-tear.mp4" poster="october-tear/poster.jpg" controls playsinline preload="metadata"></video>
  <div class="meta"><span>30s</span><span>1920×1080</span><span>136 BPM</span><span>HyperFrames</span></div>
  <footer>소스, 기획서, 스토리보드: <a href="https://github.com/airoasting/motion/tree/main/october-tear">github.com/airoasting/motion</a></footer>
</main>
</body>
</html>
