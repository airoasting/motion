<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8" /><title>05-still</title></head>
<body>
<template>
  <style>
@font-face{font-family:"Pretendard";src:url("assets/fonts/Pretendard-subset.woff2") format("woff2");font-weight:100 900;font-display:block;}
#stage{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden;background:#F0ECE5;font-family:"Pretendard",sans-serif;color:#111111;word-break:keep-all;}
#g1{position:absolute;inset:0;}
#g1_line{position:absolute;left:0;top:0;width:1920px;height:1080px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;}
#g1_line .ln{font-size:96px;font-weight:300;line-height:1.28;letter-spacing:0.06em;white-space:nowrap;color:#111111;}
#g1_dot{color:#111111;}
.g1_lbl{position:absolute;bottom:59px;font-family:"IBM Plex Mono","Pretendard",monospace;font-size:18px;font-weight:500;letter-spacing:0.14em;text-transform:uppercase;white-space:nowrap;line-height:1;}
#g1_lbl_l{left:106px;color:#505048;}
#g1_lbl_r{right:106px;color:#505048;}
.g1_sec{display:inline;}
#g1_s22{display:none;}
  </style>
  <div id="stage" data-composition-id="05-still" data-width="1920" data-height="1080" data-duration="3.32">
    <div id="g1">
      <div id="g1_line">
        <div class="ln">10월의 아침은</div>
        <div class="ln">조용히 오지 않는다<span id="g1_dot">.</span></div>
      </div>
      <div class="g1_lbl" id="g1_lbl_l">10.30 · 06:47:<span class="g1_sec" id="g1_s21">21</span><span class="g1_sec" id="g1_s22">22</span></div>
      <div class="g1_lbl" id="g1_lbl_r">06:47 AM · SEOUL</div>
    </div>
  </div>
  <script>
    (function(){
      window.__timelines = window.__timelines || {};
      var tl = gsap.timeline({paused:true});
      // 0.00: hard cut onto cream, closing line fully visible, dead still (no fade).
      tl.set("#g1",{autoAlpha:1},0);
      tl.set("#g1_s21",{display:"inline"},0);

      tl.set("#g1_dot",{color:"#111111"},0);
      // 1.34 local (track ~28.02): the single clock tick. 0ms swap 21 -> 22, final period turns fire-orange.
      var TICK = 1.34;
      tl.set("#g1_s21",{display:"none"},TICK);
      tl.set("#g1_s22",{display:"inline"},TICK);
      tl.set("#g1_dot",{color:"#E85D26"},TICK);
      // hold to frame end
      tl.set({}, {}, 3.32);
      tl.seek(0);
      window.__timelines["05-still"] = tl;
    })();
  </script>
</template>
</body>
</html>
