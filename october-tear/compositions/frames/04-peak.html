<!doctype html>
<html lang="ko">
<head><meta charset="UTF-8" /><title>04-peak</title></head>
<body>
<template>
  <style>
@font-face{font-family:"Pretendard";src:url("assets/fonts/Pretendard-subset.woff2") format("woff2");font-weight:100 900;font-display:block;}
#stage{position:absolute;inset:0;width:1920px;height:1080px;overflow:hidden;background:#111111;font-family:"Pretendard",sans-serif;word-break:keep-all;}
.grp{position:absolute;inset:0;overflow:hidden;background:#111111;}
#g2,#g3,#g4{visibility:hidden;opacity:0;}

/* g1 — negative-space gather */
.g1_jw{position:absolute;left:960px;top:540px;width:0;height:0;}
.g1_j{position:absolute;left:0;top:0;display:block;font-family:"Pretendard",sans-serif;font-weight:900;font-size:120px;line-height:1;color:#888880;white-space:nowrap;}

/* g2 — word stack slam */
#g2_shake,#g2_zoom{position:absolute;inset:0;transform-origin:50% 50%;}
#g2_stack{position:absolute;left:64px;top:-34px;width:3200px;transform-origin:0% 50%;}
.g2_row{display:block;white-space:nowrap;line-height:0.97;letter-spacing:-0.04em;font-family:"Pretendard",sans-serif;font-weight:900;}
.g2_word{display:inline-block;color:#F0ECE5;font-weight:900;opacity:0;}
.g2_ghost{display:inline-block;color:#505048;font-weight:900;margin-left:0.18em;}

/* g3 — roll flipbook word cycle (forked template) */
.g3_overlay{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
.g3_stack{display:grid;place-items:center;}
.g3_stack > *{grid-area:1 / 1;}
.g3_layer{white-space:nowrap;color:#F0ECE5;font-family:"Pretendard",sans-serif;font-weight:900;line-height:1;letter-spacing:-0.04em;visibility:hidden;opacity:0;}
.g3_flip{font-size:300px;}
.g3_resolve{font-size:340px;}
#g3_rule{position:absolute;left:50%;top:50%;width:72px;height:4px;margin-left:-36px;margin-top:210px;background:#E85D26;visibility:hidden;opacity:0;}

/* g4 — torn climax */
#g4_shift,#g4_scale{position:absolute;inset:0;transform-origin:50% 50%;}
.g4_layer{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;}
.g4_word{display:block;font-family:"Pretendard",sans-serif;font-weight:900;font-size:1080px;line-height:1;letter-spacing:-0.08em;white-space:nowrap;color:#E85D26;}
#g4_chroma .g4_word{color:#F0ECE5;}
#g4_flash{position:absolute;inset:0;background:#F0ECE5;opacity:0;}
#g4_fire{position:absolute;inset:0;background:#E85D26;opacity:0;}
  </style>

  <div id="stage" data-layout-allow-overlap data-composition-id="04-peak" data-width="1920" data-height="1080" data-duration="11.169">

    <!-- g1 · 0–1.347 · four jamo gather from the corners -->
    <div id="g1" class="grp" data-layout-allow-overflow>
      <div class="g1_jw" id="g1_jw0"><div class="g1_j" id="g1_j0">ㄱ</div></div>
      <div class="g1_jw" id="g1_jw1"><div class="g1_j" id="g1_j1">ㅗ</div></div>
      <div class="g1_jw" id="g1_jw2"><div class="g1_j" id="g1_j2">ㅇ</div></div>
      <div class="g1_jw" id="g1_jw3"><div class="g1_j" id="g1_j3">ㅛ</div></div>
    </div>

    <!-- g2 · 1.347–5.341 · full-frame stacked poster -->
    <div id="g2" class="grp" data-layout-allow-overflow>
      <div id="g2_shake" data-layout-allow-overflow>
        <div id="g2_zoom" data-layout-allow-overflow>
          <div id="g2_stack" data-layout-allow-overflow>
            <div data-layout-allow-overlap class="g2_row" style="font-size:224px"><span data-layout-allow-overlap class="g2_word" id="g2_w0">차갑다</span><span data-layout-allow-overlap class="g2_ghost">차갑다 차갑다 차갑다</span></div>
            <div data-layout-allow-overlap class="g2_row" style="font-size:300px"><span data-layout-allow-overlap class="g2_word" id="g2_w1">숨</span><span data-layout-allow-overlap class="g2_ghost">숨 숨 숨 숨 숨 숨</span></div>
            <div data-layout-allow-overlap class="g2_row" style="font-size:224px"><span data-layout-allow-overlap class="g2_word" id="g2_w2">깨어나</span><span data-layout-allow-overlap class="g2_ghost">깨어나 깨어나 깨어나</span></div>
            <div data-layout-allow-overlap class="g2_row" style="font-size:256px"><span data-layout-allow-overlap class="g2_word" id="g2_w3">10월</span><span data-layout-allow-overlap class="g2_ghost">10월 10월 10월 10월</span></div>
            <div data-layout-allow-overlap class="g2_row" style="font-size:288px"><span data-layout-allow-overlap class="g2_word" id="g2_w4">지금</span><span data-layout-allow-overlap class="g2_ghost">지금 지금 지금 지금</span></div>
          </div>
        </div>
      </div>
    </div>

    <!-- g3 · 5.341–8.452 · hi-hat flipbook → lock 아침은 -->
    <div id="g3" class="grp">
      <div class="g3_overlay"><div class="g3_stack" id="g3_stack"></div></div>
      <div id="g3_rule"></div>
    </div>

    <!-- g4 · 8.452–11.169 · giant 고요 torn per beat, frozen at the end -->
    <div id="g4" class="grp" data-layout-allow-overflow>
      <div id="g4_shift" data-layout-allow-overflow>
        <div id="g4_scale" data-layout-allow-overflow>
          <div class="g4_layer" id="g4_chroma"><span class="g4_word">고요</span></div>
          <div class="g4_layer g4_band" id="g4_b0" style="clip-path:inset(0px 0 842px 0)"><span class="g4_word">고요</span></div>
          <div class="g4_layer g4_band" id="g4_b1" style="clip-path:inset(238px 0 638px 0)"><span class="g4_word">고요</span></div>
          <div class="g4_layer g4_band" id="g4_b2" style="clip-path:inset(442px 0 452px 0)"><span class="g4_word">고요</span></div>
          <div class="g4_layer g4_band" id="g4_b3" style="clip-path:inset(628px 0 226px 0)"><span class="g4_word">고요</span></div>
          <div class="g4_layer g4_band" id="g4_b4" style="clip-path:inset(854px 0 0px 0)"><span class="g4_word">고요</span></div>
        </div>
      </div>
      <div id="g4_flash"></div>
      <div id="g4_fire"></div>
    </div>
  </div>

  <script>
    (function () {
      var tl = gsap.timeline({ paused: true });
      var T0 = 15.511; // frame start on the track; local = track - T0
      function L(t) { return +(t - T0).toFixed(3); }

      var G1 = [0, 1.347], G2 = [1.347, 5.341], G3 = [5.341, 8.452], G4 = [8.452, 11.169];
      var END = 11.169;

      // ── group cuts (0ms) ───────────────────────────────────────────────
      tl.set("#g1", { autoAlpha: 0 }, G1[1]);
      tl.set("#g2", { autoAlpha: 1 }, G2[0]);
      tl.set("#g2", { autoAlpha: 0 }, G2[1]);
      tl.set("#g3", { autoAlpha: 1 }, G3[0]);
      tl.set("#g3", { autoAlpha: 0 }, G3[1]);
      tl.set("#g4", { autoAlpha: 1 }, G4[0]);

      // ════ g1 · negative-space gather ═══════════════════════════════════
      var G1_TIGHT = L(16.393); // 0.882
      var G1_SNAP = L(16.7);    // 1.189 kick
      var START = [[-820, -420], [820, -420], [-820, 420], [820, 420]];
      var FINAL = [[-78, -66], [78, -66], [-78, 66], [78, 66]];
      var ROT0 = [-14, 11, 9, -12];
      function mix(a, b, p) { return a + (b - a) * p; }
      for (var j = 0; j < 4; j++) {
        var jw = "#g1_jw" + j, jg = "#g1_j" + j;
        gsap.set(jg, { xPercent: -50, yPercent: -50 });
        var s = START[j], f = FINAL[j];
        // staggered reveal from the corners
        tl.fromTo(jg, { opacity: 0 }, { opacity: 1, duration: 0.22, ease: "none" }, 0.04 + j * 0.09);
        // slow drift inward to 45% of the path
        tl.fromTo(jw,
          { x: s[0], y: s[1], rotation: ROT0[j] },
          { x: mix(s[0], f[0], 0.45), y: mix(s[1], f[1], 0.45), rotation: ROT0[j] * 0.6, duration: G1_TIGHT, ease: "none" }, 0);
        // 0ms tighten on the 16.393 beat, then creep
        tl.set(jw, { x: mix(s[0], f[0], 0.74), y: mix(s[1], f[1], 0.74), rotation: ROT0[j] * 0.3 }, G1_TIGHT);
        tl.to(jw, { x: mix(s[0], f[0], 0.88), y: mix(s[1], f[1], 0.88), duration: G1_SNAP - G1_TIGHT, ease: "none" }, G1_TIGHT);
        // kick: snap to a tight cluster, fire-orange
        tl.set(jw, { x: f[0], y: f[1], rotation: 0 }, G1_SNAP);
        tl.set(jg, { color: "#E85D26", scale: 1.25 }, G1_SNAP);
        tl.to(jg, { scale: 1.0, duration: 0.12, ease: "power3.out" }, G1_SNAP);
      }

      // ════ g2 · word stack slam ═════════════════════════════════════════
      var SURGE = L(16.858); // 1.347
      // crash-zoom on the surge: the ghost rows hit at 2.2x and pull back to frame
      tl.fromTo("#g2_zoom", { scale: 2.2, filter: "blur(12px)" },
        { scale: 1, filter: "blur(0px)", duration: 0.26, ease: "power4.out" }, SURGE);
      var SH_SMALL = [12, -9, 6, -3, 0];
      function shake(t, amps, step) {
        for (var k = 0; k < amps.length; k++) {
          tl.set("#g2_shake", { x: amps[k], y: amps[k] * 0.5 * (k % 2 ? -1 : 1) }, t + k * step);
        }
      }
      shake(SURGE + 0.26, SH_SMALL, 0.033);

      var SLAM = [17.299, 17.74, 18.181, 18.622, 19.064].map(L); // one line per beat
      for (var w = 0; w < 5; w++) {
        var wid = "#g2_w" + w;
        tl.set(wid, { opacity: 1 }, SLAM[w]);
        tl.fromTo(wid, { x: -70, scale: 1.08, transformOrigin: "0% 60%" },
          { x: 0, scale: 1, duration: 0.12, ease: "power3.out", immediateRender: false }, SLAM[w]);
        shake(SLAM[w], SH_SMALL, 0.03);
      }
      // hi-hat accel rolls 17.46–18.48, 18.76–20.69 (baked from audiomap events[] drum=hihat)
      var HH2 = [17.461, 17.694, 18.135, 18.274, 18.367, 18.762, 19.156, 19.249, 19.482, 19.691, 19.923, 20.039, 20.387].map(L);
      for (var h = 0; h < HH2.length; h++) {
        var newest = -1;
        for (var q = 0; q < SLAM.length; q++) if (SLAM[q] <= HH2[h]) newest = q;
        if (newest < 0) continue;
        var nid = "#g2_w" + newest;
        tl.set(nid, { fontWeight: 300 }, HH2[h]);
        tl.set(nid, { fontWeight: 900 }, HH2[h] + 0.055);
      }
      // 19.064 last line lands → whole stack braam-punch
      tl.set("#g2_stack", { scale: 1.04 }, SLAM[4]);
      tl.to("#g2_stack", { scale: 1, duration: 0.3, ease: "power3.out" }, SLAM[4] + 0.01);
      // 19.505 palette-flip (0ms) → orange ground, ink type
      var FLIP = L(19.505);
      tl.set("#g2", { backgroundColor: "#E85D26" }, FLIP);
      tl.set(".g2_word", { color: "#111111" }, FLIP);
      tl.set(".g2_ghost", { color: "rgba(17,17,17,0.40)" }, FLIP);
      shake(FLIP, SH_SMALL, 0.03);
      // 19.946 punch
      var P2 = L(19.946);
      tl.set("#g2_stack", { scale: 1.035 }, P2);
      tl.to("#g2_stack", { scale: 1, duration: 0.25, ease: "power3.out" }, P2 + 0.01);
      // 20.387 one hard shake
      shake(L(20.387), [34, -28, 22, -15, 9, -4, 0], 0.033);

      // ════ g3 · roll-flipbook word cycle (fork of templates/roll-flipbook-word-cycle) ═
      var stack = document.getElementById("g3_stack");
      var WORDS = "고요,차갑다,숨,깨어나,10월,지금,아침,새벽,06:47,찢어,소리".split(",");
      var RESOLVE = "아침은";
      var BEAT = {
        bpm: 136.0,
        rollStart: L(21.04),     // 5.529
        flipEnd: 7.46,           // flicker fills the roll, then clears for the decode
        resolveLock: L(23.522),  // 8.011
      };
      var FLIP_STEP = 60 / BEAT.bpm / 4; // 16th note
      var flipNodes = {};
      WORDS.forEach(function (wd) {
        if (!flipNodes[wd]) {
          var sp = document.createElement("span");
          sp.className = "g3_layer g3_flip";
          sp.textContent = wd;
          stack.appendChild(sp);
          flipNodes[wd] = sp;
        }
      });
      // flip times: one on the group cut, then every 16th from the roll start
      var FT = [G3[0]];
      for (var k2 = 0; BEAT.rollStart + k2 * FLIP_STEP < BEAT.flipEnd - 0.01; k2++) FT.push(+(BEAT.rollStart + k2 * FLIP_STEP).toFixed(3));
      var prev = null;
      for (var i = 0; i < FT.length; i++) {
        var node = flipNodes[WORDS[i % WORDS.length]];
        if (prev && prev !== node) tl.set(prev, { autoAlpha: 0 }, FT[i]);
        tl.set(node, { autoAlpha: 1 }, FT[i]);
        prev = node;
      }
      tl.fromTo(flipNodes[WORDS[0]], { scale: 0.82, filter: "blur(10px)" },
        { scale: 1, filter: "blur(0px)", duration: 0.12, ease: "power2.out", immediateRender: false }, G3[0]);
      tl.set(prev, { autoAlpha: 0 }, BEAT.flipEnd);

      // scramble-decode into the lock phrase (Hangul glyph pool), locks on 23.522
      var GLYPHS = "ㄱㅗㅇㅛ고요숨차갑깨어나지금새벽찢소리";
      function decodeAt(str, p) {
        var n = str.length, out = "", st = Math.floor(p * 48);
        for (var c = 0; c < n; c++) {
          var lock = 0.4 + 0.6 * ((c + 1) / n);
          out += p >= lock ? str.charAt(c) : GLYPHS.charAt((c * 7 + st * 3) % GLYPHS.length);
        }
        return out;
      }
      var DECODE_STEP = FLIP_STEP / 2;
      var N_STEPS = Math.max(1, Math.round((BEAT.resolveLock - BEAT.flipEnd) / DECODE_STEP));
      var prevR = null;
      for (var r = 0; r <= N_STEPS; r++) {
        var rn = document.createElement("span");
        rn.className = "g3_layer g3_resolve";
        rn.textContent = r === N_STEPS ? RESOLVE : decodeAt(RESOLVE, r / N_STEPS);
        stack.appendChild(rn);
        var rt = r === N_STEPS ? BEAT.resolveLock : +(BEAT.flipEnd + r * DECODE_STEP).toFixed(3);
        if (rt >= BEAT.resolveLock && r !== N_STEPS) continue;
        if (prevR) tl.set(prevR, { autoAlpha: 0 }, rt);
        tl.set(rn, { autoAlpha: 1 }, rt);
        prevR = rn;
      }
      // lock: orange stub rule under the phrase (the system's one ornament)
      tl.set("#g3_rule", { autoAlpha: 1 }, BEAT.resolveLock);

      // ════ g4 · torn climax + freeze ════════════════════════════════════
      var SLAM4 = G4[0];                                   // 8.452
      var HITS = [24.404, 24.845, 25.287, 25.728].map(L);  // tear further each beat
      var LAST = L(26.192);                                // final flash-cut → freeze
      var BANDS = ["#g4_b0", "#g4_b1", "#g4_b2", "#g4_b3", "#g4_b4"];
      // band x offsets per tear stage (fixed table, seek-safe)
      var STAGE = [
        [0, 0, 0, 0, 0],
        [-24, 38, -16, 28, -34],
        [-58, 66, -42, 74, -48],
        [-86, 98, -72, 54, -104],
        [-120, 76, -112, 118, -64],
      ];
      var FREEZE = [-132, 92, -118, 124, -86];
      var CHROMA = [0, 18, 26, 34, 42];
      // hi-hat jitter on the final fill 25.26–26.36 (baked from audiomap events[] drum=hihat)
      var HH4 = [25.263, 25.379, 25.472, 25.704, 25.913, 26.355].map(L);
      var JIT = [
        [14, -22, 9, -17, 25],
        [-19, 12, -26, 8, -11],
        [23, -9, 17, -24, 6],
        [-12, 27, -8, 15, -21],
        [8, -15, 22, -6, 18],
        [-25, 10, -14, 21, -9],
      ];

      // slam: 0ms in at 1.24x, settle to the cropped 1.1x
      tl.set("#g4_scale", { scale: 1.24 }, SLAM4);
      tl.to("#g4_scale", { scale: 1.1, duration: 0.2, ease: "power3.out" }, SLAM4 + 0.01);
      tl.set("#g4_flash", { opacity: 0.9 }, SLAM4);
      tl.set("#g4_flash", { opacity: 0 }, SLAM4 + 0.034);

      function stageAt(t) {
        var s = 0;
        for (var a = 0; a < HITS.length; a++) if (HITS[a] <= t) s = a + 1;
        return s;
      }
      for (var hI = 0; hI < HITS.length; hI++) {
        var t4 = HITS[hI], st4 = hI + 1;
        for (var b = 0; b < BANDS.length; b++) tl.set(BANDS[b], { x: STAGE[st4][b] }, t4);
        tl.set("#g4_chroma", { x: CHROMA[st4] }, t4);
        tl.set("#g4_chroma", { x: 6 }, t4 + 0.067);
        tl.set("#g4_flash", { opacity: 0.85 }, t4);
        tl.set("#g4_flash", { opacity: 0 }, t4 + 0.034);
        tl.set("#g4_scale", { scale: 1.16 }, t4);
        tl.to("#g4_scale", { scale: 1.1, duration: 0.16, ease: "power3.out" }, t4 + 0.01);
      }
      for (var hh = 0; hh < HH4.length; hh++) {
        var th = HH4[hh];
        if (th >= LAST) continue; // the freeze owns everything after the last flash
        var base = STAGE[stageAt(th)];
        for (var b2 = 0; b2 < BANDS.length; b2++) tl.set(BANDS[b2], { x: base[b2] + JIT[hh][b2] }, th);
        tl.set("#g4_chroma", { x: (hh % 2 ? -1 : 1) * 22 }, th);
      }
      // 26.192: full-frame orange flash-cut, then freeze-hold the torn state
      tl.set("#g4_fire", { opacity: 1 }, LAST);
      tl.set("#g4_fire", { opacity: 0 }, LAST + 0.067);
      for (var b3 = 0; b3 < BANDS.length; b3++) tl.set(BANDS[b3], { x: FREEZE[b3] }, LAST + 0.067);
      tl.set("#g4_chroma", { x: 30 }, LAST + 0.067);
      tl.set("#g4_scale", { scale: 1.1 }, LAST + 0.067);

      // keep the held final state rendering to the frame end
      tl.set({}, {}, END);
      window.__timelines["04-peak"] = tl;
      tl.seek(0);
    })();
  </script>
</template>
</body>
